<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой бот</title>

<style>
body {
    background: #111;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
}

/* Синие кнопки */
button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px 20px;
    margin: 10px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background-color: #0056b3;
}
</style>

</head>

<body>

<h1 style="color:white;">Мой бот</h1>

<button>Кнопка 1</button>
<button>Кнопка 2</button>
<button>Кнопка 3</button>

</body>
</html>
